<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0806" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Linkage" />
  <title>Вход — Linkage Message</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div id="screen-auth" class="auth-screen">
    <div class="auth-card" id="auth-card">
      <div class="auth-logo stagger-in" style="--i: 0">
        <svg class="brand-mark draw breathe" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="auth-grad" gradientUnits="userSpaceOnUse" x1="8" y1="14" x2="56" y2="50">
              <stop offset="0" stop-color="#FFE27A" />
              <stop offset=".45" stop-color="#FFB224" />
              <stop offset="1" stop-color="#FF5E1A" />
            </linearGradient>
          </defs>
          <circle class="bm-ring bm-a" cx="24" cy="32" r="14" stroke="url(#auth-grad)" />
          <circle class="bm-ring bm-b" cx="40" cy="32" r="14" stroke="url(#auth-grad)" />
          <path class="bm-gap" d="M27.62 18.48 A14 14 0 0 1 35.47 23.97" />
          <path class="bm-ring bm-link" d="M27.62 18.48 A14 14 0 0 1 35.47 23.97" stroke="url(#auth-grad)" />
        </svg>
        <h1 class="wordmark">Linkage Message</h1>
      </div>
      <p class="sub stagger-in" style="--i: 1" id="auth-sub">Войдите в свой аккаунт</p>

      <form id="auth-form">
        <!-- Register-only fields -->
        <div class="field avatar-upload-field hidden" id="register-avatar-field">
          <div class="avatar-upload" id="avatar-upload">
            <div class="avatar avatar-xl" id="setup-avatar-preview">?</div>
            <button type="button" class="avatar-camera-btn" id="setup-avatar-pick-btn" title="Загрузить фото">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="14" r="3.5"/></svg>
            </button>
          </div>
          <input type="file" id="setup-avatar-input" accept="image/*" class="hidden" />
          <button type="button" class="link-btn" id="setup-avatar-remove-btn" hidden>Удалить фото</button>
        </div>

        <div class="field hidden" id="nickname-field">
          <label for="nickname-input">Ник</label>
          <input id="nickname-input" type="text" maxlength="40" autocomplete="off" />
        </div>

        <div class="field stagger-in" style="--i: 2">
          <label for="username-input">Имя пользователя</label>
          <input id="username-input" type="text" maxlength="20" autocomplete="username" required />
          <div class="field-hint hidden" id="username-hint"></div>
        </div>

        <div class="field stagger-in" style="--i: 3">
          <label for="password-input">Пароль</label>
          <div class="password-field">
            <input id="password-input" type="password" autocomplete="current-password" required />
            <button type="button" class="password-toggle" id="password-toggle"></button>
          </div>
        </div>

        <!-- Register-only field -->
        <div class="field hidden" id="confirm-password-field">
          <label for="confirm-password-input">Подтвердите пароль</label>
          <div class="password-field">
            <input id="confirm-password-input" type="password" autocomplete="new-password" />
            <button type="button" class="password-toggle" id="confirm-password-toggle"></button>
          </div>
        </div>

        <button class="primary stagger-in" style="--i: 4" type="submit" id="auth-submit">Войти</button>
        <div class="auth-error" id="auth-error"></div>
      </form>

      <button type="button" class="switch-mode-btn stagger-in" style="--i: 5" id="switch-mode-btn">Ещё нет аккаунта? Зарегистрируйтесь</button>
    </div>
  </div>

  <script src="no-zoom.js"></script>
  <script src="bg.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
