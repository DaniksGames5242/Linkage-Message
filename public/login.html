<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Linkage Message</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 1. Phone entry -->
  <div id="screen-phone" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="dot"></div>
        <h1>Linkage Message</h1>
      </div>
      <p class="sub">Введите номер телефона, чтобы войти или зарегистрироваться</p>

      <form id="phone-form">
        <div class="field">
          <label for="phone-input">Номер телефона</label>
          <input id="phone-input" type="tel" placeholder="+79991234567" autocomplete="tel" required />
        </div>
        <button class="primary" type="submit" id="phone-submit">Получить код</button>
        <div class="auth-error" id="phone-error"></div>
      </form>

      <div id="recaptcha-container"></div>

      <div class="auth-hint">
        Мы пришлём одноразовый код по SMS. Регистрация не требует пароля.
      </div>
    </div>
  </div>

  <!-- 2. OTP code -->
  <div id="screen-otp" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="dot"></div>
        <h1>Код подтверждения</h1>
      </div>
      <p class="sub" id="otp-sub">Введите код из SMS</p>

      <form id="otp-form">
        <div class="field">
          <label for="otp-input">Код из SMS</label>
          <input id="otp-input" type="text" inputmode="numeric" maxlength="8" placeholder="123456" autocomplete="one-time-code" required />
        </div>
        <button class="primary" type="submit" id="otp-submit">Подтвердить</button>
        <div class="auth-error" id="otp-error"></div>
      </form>

      <div class="auth-links">
        <button type="button" class="link-btn" id="otp-back">Изменить номер</button>
        <button type="button" class="link-btn" id="otp-resend">Отправить код повторно</button>
      </div>
    </div>
  </div>

  <!-- 3. Profile setup (first login) -->
  <div id="screen-profile" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="dot"></div>
        <h1>Создайте профиль</h1>
      </div>
      <p class="sub">Придумайте юзернейм и имя, которые увидят другие</p>

      <form id="profile-form">
        <div class="field avatar-picker-field">
          <label>Аватар (необязательно)</label>
          <div class="avatar-picker" id="avatar-picker"></div>
        </div>
        <div class="field">
          <label for="displayname-input">Имя</label>
          <input id="displayname-input" type="text" maxlength="40" placeholder="Например, Даник" required />
        </div>
        <div class="field">
          <label for="username-input">Юзернейм</label>
          <input id="username-input" type="text" maxlength="20" placeholder="danik_games" autocomplete="off" required />
          <div class="field-hint" id="username-hint">3-20 символов: латиница, цифры, _</div>
        </div>
        <button class="primary" type="submit" id="profile-submit">Продолжить</button>
        <div class="auth-error" id="profile-error"></div>
      </form>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
