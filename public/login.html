<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Linkage Message</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 1. Email + password -->
  <div id="screen-email" class="auth-screen">
    <div class="auth-card" id="email-card">
      <div class="auth-logo">
        <div class="dot"></div>
        <h1>Linkage Message</h1>
      </div>
      <p class="sub" id="email-sub">Войдите в свой аккаунт</p>

      <form id="email-form">
        <div class="field">
          <label for="email-input">Email</label>
          <input id="email-input" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password-input">Пароль</label>
          <input id="password-input" type="password" placeholder="Минимум 6 символов" autocomplete="current-password" required />
        </div>
        <button class="primary" type="submit" id="email-submit">Войти</button>
        <div class="auth-error" id="email-error"></div>
      </form>

      <button type="button" class="switch-mode-btn" id="switch-mode-btn">Ещё нет аккаунта? Зарегистрируйтесь</button>
    </div>
  </div>

  <!-- 2. Profile setup (first login) -->
  <div id="screen-profile" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="dot"></div>
        <h1>Создайте профиль</h1>
      </div>
      <p class="sub">Придумайте юзернейм и имя, которые увидят другие</p>

      <form id="profile-form">
        <div class="field avatar-upload-field">
          <div class="avatar-upload" id="avatar-upload">
            <div class="avatar avatar-xl" id="setup-avatar-preview">?</div>
            <button type="button" class="avatar-camera-btn" id="setup-avatar-pick-btn" title="Загрузить фото">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="14" r="3.5"/></svg>
            </button>
          </div>
          <input type="file" id="setup-avatar-input" accept="image/*" class="hidden" />
          <button type="button" class="link-btn" id="setup-avatar-remove-btn" hidden>Удалить фото</button>
        </div>
        <div class="field">
          <label for="displayname-input">Имя</label>
          <input id="displayname-input" type="text" maxlength="40" placeholder="Например, Даник" required />
        </div>
        <div class="field">
          <label for="username-input">Юзернейм</label>
          <input id="username-input" type="text" maxlength="20" placeholder="danik_games" autocomplete="off" required />
          <div class="field-hint" id="username-hint">3-20 символов: латиница, цифры, _</div>
        </div>
        <button class="primary" type="submit" id="profile-submit">Продолжить</button>
        <div class="auth-error" id="profile-error"></div>
      </form>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
