<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Вход — Linkage Message</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="screen-auth" class="auth-screen">
    <div class="auth-card" id="auth-card">
      <div class="auth-logo">
        <div class="dot"></div>
        <h1>Linkage Message</h1>
      </div>
      <p class="sub" id="auth-sub">Войдите в свой аккаунт</p>

      <form id="auth-form">
        <!-- Register-only fields -->
        <div class="field avatar-upload-field hidden" id="register-avatar-field">
          <div class="avatar-upload" id="avatar-upload">
            <div class="avatar avatar-xl" id="setup-avatar-preview">?</div>
            <button type="button" class="avatar-camera-btn" id="setup-avatar-pick-btn" title="Загрузить фото">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="14" r="3.5"/></svg>
            </button>
          </div>
          <input type="file" id="setup-avatar-input" accept="image/*" class="hidden" />
          <button type="button" class="link-btn" id="setup-avatar-remove-btn" hidden>Удалить фото</button>
        </div>

        <div class="field hidden" id="nickname-field">
          <label for="nickname-input">Ник</label>
          <input id="nickname-input" type="text" maxlength="40" autocomplete="off" />
        </div>

        <div class="field">
          <label for="username-input">Имя пользователя</label>
          <input id="username-input" type="text" maxlength="20" autocomplete="username" required />
          <div class="field-hint hidden" id="username-hint"></div>
        </div>

        <div class="field">
          <label for="password-input">Пароль</label>
          <div class="password-field">
            <input id="password-input" type="password" autocomplete="current-password" required />
            <button type="button" class="password-toggle" id="password-toggle"></button>
          </div>
        </div>

        <!-- Register-only field -->
        <div class="field hidden" id="confirm-password-field">
          <label for="confirm-password-input">Подтвердите пароль</label>
          <div class="password-field">
            <input id="confirm-password-input" type="password" autocomplete="new-password" />
            <button type="button" class="password-toggle" id="confirm-password-toggle"></button>
          </div>
        </div>

        <button class="primary" type="submit" id="auth-submit">Войти</button>
        <div class="auth-error" id="auth-error"></div>
      </form>

      <button type="button" class="switch-mode-btn" id="switch-mode-btn">Ещё нет аккаунта? Зарегистрируйтесь</button>
    </div>
  </div>

  <script src="no-zoom.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
